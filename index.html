<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Banhsungboo - Quản lý cho thuê máy ảnh</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Comic Neue', 'Baloo 2', cursive;
            background: #fef7e8;
            background-image: radial-gradient(circle at 10% 20%, #fff3db 2%, #ffe6b3 90%);
            min-height: 100vh;
            color: #3b2a1f;
        }
        .cartoon-card {
            background: #fffaf0;
            border-radius: 48px 24px 48px 24px;
            box-shadow: 12px 12px 0 #ffc28c, 0 8px 20px rgba(0,0,0,0.1);
            border: 2px solid #ffb882;
            transition: 0.2s;
        }
        .cartoon-card:hover { transform: translate(-3px, -3px); box-shadow: 15px 15px 0 #ffa559; }
        button, .cute-btn {
            font-family: 'Baloo 2', cursive;
            background-color: #ffd966;
            border: none;
            border-radius: 60px;
            padding: 8px 20px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 5px 0 #b97f10;
            color: #2d2b26;
            transition: 0.05s linear;
        }
        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #b97f10; }
        .btn-danger { background-color: #ffaeae; box-shadow: 0 5px 0 #b34141; }
        .btn-success { background-color: #a3e0b0; box-shadow: 0 5px 0 #488a2e; }
        input, select {
            font-family: 'Comic Neue', monospace;
            background: #fffff0;
            border: 3px solid #ffcd94;
            border-radius: 28px;
            padding: 10px 16px;
            font-size: 1rem;
            outline: none;
        }
        input:focus, select:focus { border-color: #ff9f4a; box-shadow: 0 0 0 3px #ffddb0; }
        .app-container { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
        .sidebar {
            background: #ffecb3;
            border-right: 6px solid #ffc28c;
            padding: 2rem 1rem;
            border-radius: 0 48px 48px 0;
        }
        .logo-area { text-align: center; margin-bottom: 2rem; }
        .logo-area h2 {
            font-size: 1.8rem;
            background: #ffb347;
            display: inline-block;
            padding: 8px 16px;
            border-radius: 100px;
            color: white;
            text-shadow: 3px 3px 0 #a35100;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 14px 20px;
            margin: 12px 0;
            border-radius: 60px;
            cursor: pointer;
            background: #fff2db;
            border: 2px solid transparent;
        }
        .menu-item i { font-size: 1.8rem; width: 32px; }
        .menu-item.active {
            background: #ffc285;
            border-color: #f57c00;
            color: white;
            box-shadow: 5px 5px 0 #bd6b1e;
        }
        .main-content { padding: 30px 24px; overflow-x: auto; }
        .dashboard-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            margin-bottom: 32px;
        }
        .stat-card {
            flex: 1; min-width: 160px; background: #fff1df; border-radius: 36px; padding: 20px;
            text-align: center; border: 2px solid #ffbc6e; box-shadow: 8px 8px 0 #e6b15c;
        }
        .stat-number { font-size: 2.8rem; font-weight: 800; color: #e67e22; }
        .camera-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 26px; margin-top: 20px; }
        .camera-card { padding: 18px; }
        .rental-list { margin-top: 18px; border-top: 2px dashed #ffcd94; padding-top: 12px; max-height: 260px; overflow-y: auto; }
        .rental-item {
            background: #fff5e6; border-radius: 28px; padding: 8px 12px; margin: 8px 0;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; font-size: 0.85rem;
        }
        /* Cải thiện bảng lịch sử thuê - responsive */
        .rentals-table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 20px 0;
            border-radius: 32px;
            background: #fffef7;
        }
        .table-rentals {
            width: 100%;
            border-collapse: collapse;
            background: #fffef7;
            border-radius: 32px;
            min-width: 800px; /* Đảm bảo bảng không bị bóp quá nhỏ, mobile sẽ cuộn */
        }
        .table-rentals th, .table-rentals td {
            padding: 12px 10px;
            border-bottom: 2px solid #ffe0b5;
            text-align: left;
            white-space: nowrap;
        }
        .table-rentals th {
            background: #ffecb3;
            font-weight: bold;
            color: #a35100;
        }
        @media (max-width: 780px) {
            .table-rentals th, .table-rentals td {
                padding: 8px 8px;
                font-size: 0.75rem;
                white-space: nowrap;
            }
            .rentals-table-wrapper {
                margin: 12px -8px;
                border-radius: 24px;
            }
            .small-btn { padding: 6px 10px; font-size: 0.7rem; min-height: 36px; }
        }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
            z-index: 1000; visibility: hidden; backdrop-filter: blur(4px);
        }
        .modal-content {
            background: #fff8ec; border-radius: 56px; padding: 28px; width: 90%; max-width: 550px;
            border: 4px solid #ffb85e; box-shadow: 20px 20px 0 #ba7a2e;
            max-height: 90vh; overflow-y: auto;
        }
        .flex-btns { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
        .toast-msg {
            position: fixed; bottom: 20px; right: 20px; background: #4caf50; color: white;
            padding: 12px 24px; border-radius: 40px; font-weight: bold; z-index: 1100;
            animation: fadeInOut 2s ease;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(30px);}
            15% { opacity: 1; transform: translateY(0);}
            85% { opacity: 1; }
            100% { opacity: 0; visibility: hidden;}
        }
        .small-btn { padding: 4px 12px; font-size: 0.75rem; margin: 2px; min-height: 44px; }
        @media (max-width: 780px) {
            .app-container { grid-template-columns: 1fr; padding-bottom: 80px; }
            .sidebar {
                position: fixed; bottom: 0; left: 0; right: 0; top: auto; display: flex;
                flex-direction: row; justify-content: space-around; border-radius: 32px 32px 0 0;
                padding: 8px 12px; border-right: none; border-top: 5px solid #ffc28c; z-index: 200;
            }
            .logo-area { display: none; }
            .menu-item { flex-direction: column; gap: 4px; padding: 8px 12px; margin: 4px 0; font-size: 0.75rem; text-align: center; }
            .menu-item i { font-size: 1.5rem; width: auto; }
            .main-content { padding: 20px 16px 90px 16px; }
            .dashboard-stats { flex-direction: column; }
            .small-btn { padding: 6px 10px; font-size: 0.7rem; }
        }
        footer { text-align: center; margin-top: 40px; padding: 16px; font-size: 0.8rem; color: #b97f10; }
        .delete-icon { cursor: pointer; color: #dc6b4a; }
        .badge-total { font-weight: bold; color: #e67e22; }
        .social-link { color: #3b5998; text-decoration: none; }
        .social-link:hover { text-decoration: underline; }
        .text-center { text-align: center; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="sidebar">
        <div class="logo-area"><h2 id="dynamicTitle"><i class="fas fa-camera-retro"></i> Banhsungboo</h2></div>
        <div class="menu-item" data-view="dashboard"><i class="fas fa-chart-line"></i> <span>📊 Thống kê</span></div>
        <div class="menu-item" data-view="cameras"><i class="fas fa-camera"></i> <span>📷 Máy ảnh</span></div>
        <div class="menu-item" data-view="rentals"><i class="fas fa-calendar-check"></i> <span>📅 Lịch thuê</span></div>
        <div class="menu-item" data-view="settings"><i class="fas fa-sliders-h"></i> <span>⚙️ Cài đặt</span></div>
    </div>
    <div class="main-content" id="mainContent"></div>
</div>

<!-- Modal đặt lịch thuê -->
<div id="rentalModal" class="modal-overlay">
    <div class="modal-content">
        <h3><i class="fas fa-credit-card"></i> Đặt lịch thuê</h3>
        <p id="modalCameraName" style="font-weight:bold; margin:10px 0"></p>
        <input type="hidden" id="modalCameraId">
        <label>🧑 Khách hàng *:</label>
        <input type="text" id="customerName" placeholder="Nhập tên khách hàng" required style="width:100%; margin:8px 0">
        <label>📱 Instagram / Facebook (link):</label>
        <input type="url" id="customerSocial" placeholder="https://instagram.com/..." style="width:100%; margin:8px 0">
        <label>⏱️ Bắt đầu:</label>
        <input type="datetime-local" id="rentalStart" style="width:100%; margin:8px 0">
        <label>⏲️ Kết thúc:</label>
        <input type="datetime-local" id="rentalEnd" style="width:100%; margin:8px 0">
        <div style="margin:16px 0 8px 0; font-weight:bold;">💰 Giá thuê và chi phí phát sinh (có thể nhập số âm)</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0;">
            <div><label>💸 Giá thuê cơ bản:</label><input type="number" id="basePrice" value="0"></div>
            <div><label>🔋 Pin dự phòng:</label><input type="number" id="extraPin" value="0"></div>
            <div><label>🔧 Hỏng máy / sửa:</label><input type="number" id="extraDamage" value="0"></div>
            <div><label>📦 Phí ship:</label><input type="number" id="extraShipping" value="0"></div>
            <div><label>🎞️ Tráng phim:</label><input type="number" id="extraFilm" value="0"></div>
        </div>
        <div style="background:#fff0d6; border-radius:28px; padding:12px; margin-top:8px;">
            <span>🔢 Tổng doanh thu: </span><strong id="previewTotal" class="badge-total">0 VNĐ</strong>
        </div>
        <div class="flex-btns">
            <button id="saveRentalBtn" class="cute-btn btn-success"><i class="fas fa-save"></i> Lưu hợp đồng</button>
            <button id="closeModalBtn" class="cute-btn"><i class="fas fa-times"></i> Đóng</button>
        </div>
    </div>
</div>

<!-- Modal chỉnh sửa tên máy ảnh -->
<div id="editCameraModal" class="modal-overlay">
    <div class="modal-content">
        <h3><i class="fas fa-edit"></i> Chỉnh sửa tên máy ảnh</h3>
        <input type="text" id="editCameraName" class="edit-modal-input" placeholder="Nhập tên mới" style="width:100%; margin:20px 0">
        <input type="hidden" id="editCameraId">
        <div class="flex-btns">
            <button id="saveEditCameraBtn" class="cute-btn btn-success"><i class="fas fa-save"></i> Lưu</button>
            <button id="closeEditModalBtn" class="cute-btn"><i class="fas fa-times"></i> Hủy</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCUuq5cyAy_g7E0Lk2OPSPGxrd9P7umD9s",
        authDomain: "quan-ly-banhsungbo.firebaseapp.com",
        databaseURL: "https://quan-ly-banhsungbo-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "quan-ly-banhsungbo",
        storageBucket: "quan-ly-banhsungbo.firebasestorage.app",
        messagingSenderId: "311154959499",
        appId: "1:311154959499:web:6cc6d5ee44de864e43208e",
        measurementId: "G-4ZMVLL09C4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let cameras = [];
    let rentals = [];
    let appSettings = { siteTitle: "Banhsungboo Pro", headerText: "📸 Cho thuê máy ảnh - Banhsungboo", footerText: "© 2026 Banhsungboo - Thỏa sức sáng tạo" };
    let currentView = 'dashboard';
    let revenueChart = null;

    function generateId() { return Date.now() + '-' + Math.random().toString(36).substr(2, 8); }
    function formatVND(amount) { return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount); }
    function formatDate(iso) { const d = new Date(iso); return `${d.getDate()}/${d.getMonth()+1} ${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`; }
    function formatHours(h) { return h.toFixed(1) + " giờ"; }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
    function getCameraName(cameraId) { const cam = cameras.find(c => c.id === cameraId); return cam ? cam.name : null; }

    function isOverlap(cameraId, startISO, endISO, excludeId = null) {
        const newStart = new Date(startISO).getTime();
        const newEnd = new Date(endISO).getTime();
        return rentals.some(r => {
            if (r.cameraId !== cameraId) return false;
            if (excludeId && r.id === excludeId) return false;
            const rStart = new Date(r.startTime).getTime();
            const rEnd = new Date(r.endTime).getTime();
            return (newStart < rEnd && newEnd > rStart);
        });
    }

    function getStats() {
        let totalRevenue = 0, totalHours = 0;
        rentals.forEach(r => { totalRevenue += r.totalRevenue; totalHours += r.totalHours; });
        return { totalRevenue, totalHours, totalCameras: cameras.length, totalRentals: rentals.length };
    }
    
    function getMostRentedCamera() {
        const countMap = new Map();
        rentals.forEach(r => {
            if (!countMap.has(r.cameraId)) {
                let name = r.cameraName;
                if (!name) {
                    const cam = cameras.find(c => c.id === r.cameraId);
                    name = cam ? cam.name : "📷 Máy ảnh";
                }
                countMap.set(r.cameraId, { count: 0, name });
            }
            countMap.get(r.cameraId).count += 1;
        });
        let bestId = null, bestCount = 0, bestName = "";
        for (let [id, data] of countMap) {
            if (data.count > bestCount) {
                bestCount = data.count;
                bestId = id;
                bestName = data.name;
            }
        }
        if (bestId) return { name: bestName, count: bestCount };
        return { name: "Chưa có lượt thuê", count: 0 };
    }
    
    function getTopCustomers(limit = 5) {
        const customerMap = new Map();
        rentals.forEach(r => {
            if (!r.customerName) return;
            const name = r.customerName;
            if (!customerMap.has(name)) {
                customerMap.set(name, { count: 0, totalSpent: 0, social: r.customerSocial || '' });
            }
            const entry = customerMap.get(name);
            entry.count += 1;
            entry.totalSpent += r.totalRevenue;
            if (r.customerSocial) entry.social = r.customerSocial;
        });
        const sorted = Array.from(customerMap.entries()).map(([name, data]) => ({ name, ...data }));
        sorted.sort((a, b) => b.count - a.count);
        return sorted.slice(0, limit);
    }

    function subscribeCameras() {
        const camRef = ref(db, 'cameras');
        onValue(camRef, (snap) => {
            const data = snap.val();
            cameras = data ? Object.entries(data).map(([k,v]) => ({ id: k, name: v.name })) : [];
            reRenderCurrentView();
        });
    }
    function subscribeRentals() {
        const rentRef = ref(db, 'rentals');
        onValue(rentRef, (snap) => {
            const data = snap.val();
            rentals = data ? Object.entries(data).map(([k,v]) => ({ id: k, ...v })) : [];
            reRenderCurrentView();
        });
    }
    function subscribeSettings() {
        const setRef = ref(db, 'settings');
        onValue(setRef, (snap) => {
            const data = snap.val();
            if (data) appSettings = { ...appSettings, ...data };
            else update(ref(db, 'settings'), appSettings);
            document.title = appSettings.siteTitle;
            const titleEl = document.getElementById('dynamicTitle');
            if (titleEl) titleEl.innerHTML = `<i class="fas fa-camera-retro"></i> ${appSettings.siteTitle}`;
            reRenderCurrentView();
        });
    }

    async function addCamera(name) {
        if (!name.trim()) return false;
        const newId = generateId();
        await set(ref(db, `cameras/${newId}`), { name: name.trim() });
        return true;
    }
    async function deleteCamera(cameraId) {
        const hasRentals = rentals.some(r => r.cameraId === cameraId);
        if (hasRentals && !confirm("⚠️ Máy đã có lịch sử thuê. Xóa máy sẽ KHÔNG xóa lịch sử. Tiếp tục?")) return false;
        await remove(ref(db, `cameras/${cameraId}`));
        return true;
    }
    async function updateCamera(cameraId, newName) {
        await update(ref(db, `cameras/${cameraId}`), { name: newName.trim() });
        return true;
    }

    async function addRental(cameraId, startISO, endISO, basePrice, extraPin, extraDamage, extraShipping, extraFilm, customerName, customerSocial) {
        const camera = cameras.find(c => c.id === cameraId);
        if (!camera) return { success: false, msg: "Máy ảnh không tồn tại" };
        if (!customerName.trim()) return { success: false, msg: "Vui lòng nhập tên khách hàng" };
        const start = new Date(startISO);
        const end = new Date(endISO);
        if (isNaN(start) || isNaN(end)) return { success: false, msg: "Ngày không hợp lệ" };
        if (end <= start) return { success: false, msg: "Kết thúc phải sau bắt đầu" };
        if (isOverlap(cameraId, startISO, endISO)) return { success: false, msg: "❌ Thời gian bị trùng với lịch thuê khác!" };
        const hours = (end - start) / 3600000;
        const totalRevenue = basePrice + extraPin + extraDamage + extraShipping + extraFilm;
        const newId = generateId();
        const rentalData = {
            cameraId, 
            cameraName: camera.name,
            startTime: start.toISOString(), 
            endTime: end.toISOString(),
            totalHours: hours, 
            basePrice, extraPin, extraDamage, extraShipping, extraFilm,
            totalRevenue, 
            customerName: customerName.trim(), 
            customerSocial: customerSocial.trim() || ""
        };
        await set(ref(db, `rentals/${newId}`), rentalData);
        return { success: true };
    }
    async function deleteRental(rentalId) {
        await remove(ref(db, `rentals/${rentalId}`));
        return true;
    }
    async function updateSettings(newSettings) {
        await update(ref(db, 'settings'), newSettings);
    }

    function reRenderCurrentView() {
        if (currentView === 'dashboard') renderDashboard();
        else if (currentView === 'cameras') renderCameras();
        else if (currentView === 'rentals') renderAllRentals();
        else if (currentView === 'settings') renderSettings();
    }

    function renderDashboard() {
        const stats = getStats();
        const most = getMostRentedCamera();
        const topCustomers = getTopCustomers(5);
        let topCustomersHtml = `<div class="cartoon-card" style="padding:20px; margin-top:20px;">
            <h3><i class="fas fa-users"></i> 🏆 Top khách hàng thuê nhiều nhất</h3>
            <div style="overflow-x:auto;">
                <table style="width:100%; border-collapse:collapse;">
                    <thead><tr><th>#</th><th>Tên khách hàng</th><th>Số lần thuê</th><th>Tổng chi tiêu</th><th>Liên kết</th></tr></thead>
                    <tbody>`;
        if (topCustomers.length === 0) topCustomersHtml += `<tr><td colspan="5" style="text-align:center">✨ Chưa có dữ liệu khách hàng</td></tr>`;
        topCustomers.forEach((cust, idx) => {
            topCustomersHtml += `<tr style="border-bottom:1px solid #ffcd94;">
                <td style="padding:8px;">${idx+1}</td>
                <td style="padding:8px;">${escapeHtml(cust.name)}</td>
                <td style="padding:8px;">${cust.count}</td>
                <td style="padding:8px;">${formatVND(cust.totalSpent)}</td>
                <td style="padding:8px;">${cust.social ? `<a href="${escapeHtml(cust.social)}" target="_blank" class="social-link"><i class="fab fa-instagram"></i> <i class="fab fa-facebook"></i></a>` : '—'}</td>
              </tr>`;
        });
        topCustomersHtml += `</tbody> Competence</div></div>`;
        
        const html = `
            <div class="cartoon-card" style="padding:24px; margin-bottom:24px;"><h1><i class="fas fa-chalkboard-user"></i> ${escapeHtml(appSettings.headerText)}</h1></div>
            <div class="dashboard-stats">
                <div class="stat-card"><i class="fas fa-dollar-sign fa-2x"></i><div class="stat-number">${formatVND(stats.totalRevenue)}</div><div>Tổng doanh thu</div></div>
                <div class="stat-card"><i class="fas fa-hourglass-half fa-2x"></i><div class="stat-number">${formatHours(stats.totalHours)}</div><div>Tổng giờ thuê</div></div>
                <div class="stat-card"><i class="fas fa-camera fa-2x"></i><div class="stat-number">${stats.totalCameras}</div><div>Máy ảnh (hiện có)</div></div>
                <div class="stat-card"><i class="fas fa-trophy fa-2x"></i><div class="stat-number">🏆 ${escapeHtml(most.name)}</div><div>Được thuê nhiều nhất (${most.count} lượt)</div></div>
            </div>
            <div class="cartoon-card" style="padding:20px;"><canvas id="revenueChart" style="max-height:300px; width:100%"></canvas><p style="text-align:center">💰 Doanh thu theo từng máy (kể cả máy đã xóa)</p></div>
            ${topCustomersHtml}
            <footer>${escapeHtml(appSettings.footerText)}</footer>
        `;
        document.getElementById('mainContent').innerHTML = html;
        const revMap = new Map();
        rentals.forEach(r => {
            const camName = r.cameraName || getCameraName(r.cameraId) || "Máy ảnh";
            if (!revMap.has(camName)) revMap.set(camName, 0);
            revMap.set(camName, revMap.get(camName) + r.totalRevenue);
        });
        const labels = Array.from(revMap.keys());
        const data = Array.from(revMap.values());
        const ctx = document.getElementById('revenueChart')?.getContext('2d');
        if (ctx) {
            if (revenueChart) revenueChart.destroy();
            revenueChart = new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets: [{ label: 'Doanh thu (VND)', data, backgroundColor: '#ffaa66', borderRadius: 20 }] },
                options: { responsive: true, maintainAspectRatio: true }
            });
        }
    }

    function renderCameras() {
        let html = `
            <div class="cartoon-card" style="padding:20px; margin-bottom:24px;">
                <h2><i class="fas fa-plus-circle"></i> Thêm máy ảnh mới</h2>
                <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:12px;">
                    <input type="text" id="newCamName" placeholder="Tên máy ảnh (VD: Canon R6)" style="flex:1">
                    <button id="addCameraBtn" class="cute-btn"><i class="fas fa-camera"></i> Thêm máy</button>
                </div>
            </div>
            <div class="camera-grid">
        `;
        cameras.forEach(cam => {
            const camRentals = rentals.filter(r => r.cameraId === cam.id).sort((a,b)=>new Date(b.startTime)-new Date(a.startTime));
            html += `
                <div class="camera-card cartoon-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3><i class="fas fa-camera-retro"></i> ${escapeHtml(cam.name)}</h3>
                        <div>
                            <button class="small-btn editCamBtn" data-id="${cam.id}" data-name="${escapeHtml(cam.name)}"><i class="fas fa-edit"></i></button>
                            <button class="small-btn btn-danger deleteCamBtn" data-id="${cam.id}"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                    <p style="color:#b97f10;"><i class="fas fa-tag"></i> Giá nhập khi đặt lịch</p>
                    <button class="cute-btn addRentBtn" data-id="${cam.id}" data-name="${escapeHtml(cam.name)}" style="margin:8px 0"><i class="fas fa-calendar-plus"></i> Đặt lịch thuê</button>
                    <div class="rental-list">
                        <strong>📅 Lịch sử thuê (${camRentals.length} lượt):</strong>
                        ${camRentals.length === 0 ? '<p>✨ Chưa có lịch thuê</p>' : camRentals.slice(0,5).map(r => `
                            <div class="rental-item">
                                <span><strong>${escapeHtml(r.customerName || 'Khách')}</strong> ${formatDate(r.startTime)}→${formatDate(r.endTime)} (${formatHours(r.totalHours)})</span>
                                <span><strong>${formatVND(r.totalRevenue)}</strong></span>
                                <i class="fas fa-times-circle delete-icon deleteRentalBtn" data-id="${r.id}" style="cursor:pointer;"></i>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        });
        if (cameras.length === 0) html += `<div class="cartoon-card" style="padding:40px; text-align:center">🎈 Chưa có máy ảnh nào, hãy thêm máy đầu tiên!</div>`;
        html += `</div><footer>${escapeHtml(appSettings.footerText)}</footer>`;
        document.getElementById('mainContent').innerHTML = html;

        document.getElementById('addCameraBtn')?.addEventListener('click', async () => {
            const name = document.getElementById('newCamName').value;
            if (name.trim()) { await addCamera(name); showToast(`📸 Đã thêm máy ${name}`); }
            else showToast("Vui lòng nhập tên máy!");
        });
        document.querySelectorAll('.deleteCamBtn').forEach(btn => {
            btn.addEventListener('click', async () => { if (await deleteCamera(btn.dataset.id)) showToast("🗑️ Đã xóa máy (giữ lịch sử)"); });
        });
        document.querySelectorAll('.addRentBtn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.getElementById('modalCameraId').value = btn.dataset.id;
                document.getElementById('modalCameraName').innerText = `📷 Máy: ${btn.dataset.name}`;
                document.getElementById('customerName').value = '';
                document.getElementById('customerSocial').value = '';
                document.getElementById('rentalStart').value = '';
                document.getElementById('rentalEnd').value = '';
                document.getElementById('basePrice').value = '0';
                document.getElementById('extraPin').value = '0';
                document.getElementById('extraDamage').value = '0';
                document.getElementById('extraShipping').value = '0';
                document.getElementById('extraFilm').value = '0';
                updatePreviewTotal();
                document.getElementById('rentalModal').style.visibility = 'visible';
            });
        });
        document.querySelectorAll('.deleteRentalBtn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (confirm("Xóa lịch thuê này?")) { await deleteRental(btn.dataset.id); showToast("Đã xóa lịch thuê"); }
            });
        });
        document.querySelectorAll('.editCamBtn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.getElementById('editCameraId').value = btn.dataset.id;
                document.getElementById('editCameraName').value = btn.dataset.name;
                document.getElementById('editCameraModal').style.visibility = 'visible';
            });
        });
    }

    // CẢI THIỆN BẢNG LỊCH SỬ - responsive với wrapper cuộn ngang
    function renderAllRentals() {
        let html = `<div class="cartoon-card" style="padding:20px;"><h2>📋 Toàn bộ lịch sử cho thuê (kèm khách hàng)</h2></div>
        <div class="rentals-table-wrapper">
            <table class="table-rentals">
                <thead>
                    <tr>
                        <th>Khách hàng</th><th>Social</th><th>Máy ảnh</th><th>Thời gian thuê</th><th>Số giờ</th><th>Giá thuê</th><th>Pin</th><th>Hỏng</th><th>Ship</th><th>Tráng phim</th><th>Tổng</th><th>Xoá</th>
                    </tr>
                </thead>
                <tbody>`;
        if (rentals.length === 0) html += `<tr><td colspan="12" class="text-center">🎈 Chưa có lịch thuê nào</td></tr>`;
        [...rentals].sort((a,b)=>new Date(b.startTime)-new Date(a.startTime)).forEach(r => {
            const displayCameraName = r.cameraName || getCameraName(r.cameraId) || "Máy ảnh";
            html += `<tr>
                <td><strong>${escapeHtml(r.customerName || '—')}</strong></td>
                <td>${r.customerSocial ? `<a href="${escapeHtml(r.customerSocial)}" target="_blank" class="social-link"><i class="fab fa-instagram"></i> <i class="fab fa-facebook"></i> Link</a>` : '—'}</td>
                <td>${escapeHtml(displayCameraName)}</td>
                <td>${formatDate(r.startTime)} → ${formatDate(r.endTime)}</td>
                <td>${formatHours(r.totalHours)}</td>
                <td>${formatVND(r.basePrice || 0)}</td>
                <td>${formatVND(r.extraPin || 0)}</td>
                <td>${formatVND(r.extraDamage || 0)}</td>
                <td>${formatVND(r.extraShipping || 0)}</td>
                <td>${formatVND(r.extraFilm || 0)}</td>
                <td><strong>${formatVND(r.totalRevenue)}</strong></td>
                <td><button class="small-btn btn-danger deleteRentalGlobal" data-id="${r.id}"><i class="fas fa-trash"></i></button></td>
            </tr>`;
        });
        html += `</tbody></table></div><footer>${escapeHtml(appSettings.footerText)}</footer>`;
        document.getElementById('mainContent').innerHTML = html;
        document.querySelectorAll('.deleteRentalGlobal').forEach(btn => {
            btn.addEventListener('click', async () => { if (confirm("Xóa lịch thuê này?")) { await deleteRental(btn.dataset.id); showToast("Đã xóa"); } });
        });
    }

    function renderSettings() {
        let html = `
            <div class="cartoon-card" style="padding:28px;">
                <h2><i class="fas fa-sliders-h"></i> Cài đặt giao diện</h2>
                <div>
                    <label>🏷️ Tiêu đề trang:</label>
                    <input type="text" id="setTitle" value="${escapeHtml(appSettings.siteTitle)}">
                    <label>📢 Header chính:</label>
                    <input type="text" id="setHeader" value="${escapeHtml(appSettings.headerText)}">
                    <label>📌 Footer:</label>
                    <input type="text" id="setFooter" value="${escapeHtml(appSettings.footerText)}">
                    <button id="saveSettingsBtn" class="cute-btn btn-success" style="margin-top:16px"><i class="fas fa-save"></i> Lưu cài đặt</button>
                </div>
            </div>
            <footer>${escapeHtml(appSettings.footerText)}</footer>
        `;
        document.getElementById('mainContent').innerHTML = html;
        document.getElementById('saveSettingsBtn')?.addEventListener('click', async () => {
            await updateSettings({
                siteTitle: document.getElementById('setTitle').value,
                headerText: document.getElementById('setHeader').value,
                footerText: document.getElementById('setFooter').value
            });
            showToast("✅ Cập nhật giao diện thành công!");
        });
    }

    function updatePreviewTotal() {
        const base = parseFloat(document.getElementById('basePrice').value) || 0;
        const pin = parseFloat(document.getElementById('extraPin').value) || 0;
        const damage = parseFloat(document.getElementById('extraDamage').value) || 0;
        const ship = parseFloat(document.getElementById('extraShipping').value) || 0;
        const film = parseFloat(document.getElementById('extraFilm').value) || 0;
        const total = base + pin + damage + ship + film;
        document.getElementById('previewTotal').innerHTML = formatVND(total);
    }

    function showToast(msg) {
        let existing = document.querySelector('.toast-msg');
        if (existing) existing.remove();
        let div = document.createElement('div');
        div.className = 'toast-msg';
        div.innerHTML = `<i class="fas fa-smile-wink"></i> ${msg}`;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 2000);
    }

    function setActiveView(view) {
        currentView = view;
        document.querySelectorAll('.menu-item').forEach(item => {
            if (item.dataset.view === view) item.classList.add('active');
            else item.classList.remove('active');
        });
        reRenderCurrentView();
    }

    function initModals() {
        const rentalModal = document.getElementById('rentalModal');
        document.getElementById('closeModalBtn').onclick = () => rentalModal.style.visibility = 'hidden';
        window.onclick = (e) => { if (e.target === rentalModal) rentalModal.style.visibility = 'hidden'; };
        const priceInputs = ['basePrice', 'extraPin', 'extraDamage', 'extraShipping', 'extraFilm'];
        priceInputs.forEach(id => {
            document.getElementById(id).addEventListener('input', updatePreviewTotal);
        });
        document.getElementById('saveRentalBtn').onclick = async () => {
            const camId = document.getElementById('modalCameraId').value;
            const customerName = document.getElementById('customerName').value;
            const customerSocial = document.getElementById('customerSocial').value;
            const start = document.getElementById('rentalStart').value;
            const end = document.getElementById('rentalEnd').value;
            const base = parseFloat(document.getElementById('basePrice').value) || 0;
            const pin = parseFloat(document.getElementById('extraPin').value) || 0;
            const damage = parseFloat(document.getElementById('extraDamage').value) || 0;
            const ship = parseFloat(document.getElementById('extraShipping').value) || 0;
            const film = parseFloat(document.getElementById('extraFilm').value) || 0;
            if (!start || !end) { showToast("Vui lòng chọn thời gian!"); return; }
            if (!customerName.trim()) { showToast("Vui lòng nhập tên khách hàng!"); return; }
            const result = await addRental(camId, start, end, base, pin, damage, ship, film, customerName, customerSocial);
            if (result.success) { showToast("✅ Đặt lịch thành công!"); rentalModal.style.visibility = 'hidden'; }
            else showToast(`❌ ${result.msg}`);
        };
        const editModal = document.getElementById('editCameraModal');
        document.getElementById('closeEditModalBtn').onclick = () => editModal.style.visibility = 'hidden';
        window.onclick = (e) => { if (e.target === editModal) editModal.style.visibility = 'hidden'; };
        document.getElementById('saveEditCameraBtn').onclick = async () => {
            const id = document.getElementById('editCameraId').value;
            const newName = document.getElementById('editCameraName').value;
            if (newName.trim()) {
                await updateCamera(id, newName);
                showToast("✏️ Đã cập nhật tên máy");
                editModal.style.visibility = 'hidden';
            } else showToast("Tên máy không được để trống");
        };
    }

    window.addEventListener('DOMContentLoaded', () => {
        initModals();
        subscribeCameras();
        subscribeRentals();
        subscribeSettings();
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', () => setActiveView(item.dataset.view));
        });
        setActiveView('dashboard');
    });
</script>
</body>
</html>
