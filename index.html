<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Banhsungboo - Quản lý cho thuê & bán film</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Comic+Neue:wght@400;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Comic Neue', 'Be Vietnam Pro', cursive;
            background: #fef7e8;
            background-image: radial-gradient(circle at 10% 20%, #fff3db 2%, #ffe6b3 90%);
            min-height: 100vh;
            color: #3b2a1f;
            transition: font-family 0.2s;
        }
        .cartoon-card {
            background: #fffaf0;
            border-radius: 48px 24px 48px 24px;
            box-shadow: 12px 12px 0 #ffc28c, 0 8px 20px rgba(0,0,0,0.1);
            border: 2px solid #ffb882;
            transition: 0.2s;
        }
        button, .cute-btn {
            font-family: inherit;
            background-color: #ffd966;
            border: none;
            border-radius: 60px;
            padding: 8px 20px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 5px 0 #b97f10;
            color: #2d2b26;
            transition: 0.05s linear;
        }
        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #b97f10; }
        .btn-danger { background-color: #ffaeae; box-shadow: 0 5px 0 #b34141; }
        .btn-success { background-color: #a3e0b0; box-shadow: 0 5px 0 #488a2e; }
        input, select {
            font-family: inherit;
            background: #fffff0;
            border: 3px solid #ffcd94;
            border-radius: 28px;
            padding: 10px 16px;
            font-size: 1rem;
            outline: none;
        }
        .app-container { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
        .sidebar {
            background: #ffecb3;
            border-right: 6px solid #ffc28c;
            padding: 2rem 1rem;
            border-radius: 0 48px 48px 0;
        }
        .logo-area { text-align: center; margin-bottom: 2rem; }
        .logo-area h2 {
            font-size: 1.8rem;
            background: #ffb347;
            display: inline-block;
            padding: 8px 16px;
            border-radius: 100px;
            color: white;
            text-shadow: 3px 3px 0 #a35100;
        }
        .menu-section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #a35100;
            margin: 16px 0 8px 12px;
            letter-spacing: 1px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px 20px;
            margin: 6px 0;
            border-radius: 60px;
            cursor: pointer;
            background: #fff2db;
            border: 2px solid transparent;
            transition: 0.1s;
        }
        .menu-item i { font-size: 1.4rem; width: 32px; }
        .menu-item.active {
            background: #ffc285;
            border-color: #f57c00;
            color: white;
            box-shadow: 5px 5px 0 #bd6b1e;
        }
        .menu-item:hover:not(.active) {
            background: #ffe1ac;
            transform: scale(0.98);
        }
        .main-content { padding: 30px 24px; overflow-x: auto; }
        .dashboard-stats { display: flex; flex-wrap: wrap; gap: 24px; margin-bottom: 32px; }
        .stat-card {
            flex: 1; min-width: 160px; background: #fff1df; border-radius: 36px; padding: 20px;
            text-align: center; border: 2px solid #ffbc6e; box-shadow: 8px 8px 0 #e6b15c;
        }
        .stat-number { font-size: 2.8rem; font-weight: 800; color: #e67e22; }
        .camera-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 26px; margin-top: 20px; }
        .camera-card { padding: 18px; }
        .rental-list { margin-top: 18px; border-top: 2px dashed #ffcd94; padding-top: 12px; max-height: 260px; overflow-y: auto; }
        .rental-item {
            background: #fff5e6; border-radius: 28px; padding: 8px 12px; margin: 8px 0;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; font-size: 0.85rem;
        }
        .rentals-table-wrapper, .films-table-wrapper, .film-sales-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 20px 0;
            border-radius: 32px;
            background: #fffef7;
        }
        .table-rentals, .table-films, .table-sales {
            width: 100%;
            border-collapse: collapse;
            background: #fffef7;
            border-radius: 32px;
            min-width: 800px;
        }
        .table-rentals th, .table-rentals td, .table-films th, .table-films td, .table-sales th, .table-sales td {
            padding: 12px 10px;
            border-bottom: 2px solid #ffe0b5;
            text-align: left;
            white-space: nowrap;
        }
        .table-rentals th, .table-films th, .table-sales th { background: #ffecb3; font-weight: bold; color: #a35100; }
        @media (max-width: 780px) {
            .table-rentals th, .table-rentals td, .table-films th, .table-films td, .table-sales th, .table-sales td { padding: 8px 8px; font-size: 0.75rem; }
            .rentals-table-wrapper, .films-table-wrapper, .film-sales-wrapper { margin: 12px -8px; border-radius: 24px; }
            .small-btn { padding: 6px 10px; font-size: 0.7rem; min-height: 36px; }
        }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
            z-index: 1000; visibility: hidden; backdrop-filter: blur(4px);
            padding: 16px;
        }
        .modal-content {
            background: #fff8ec;
            border-radius: 56px;
            padding: 28px;
            width: 100%;
            max-width: 700px;
            border: 4px solid #ffb85e;
            box-shadow: 20px 20px 0 #ba7a2e;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            margin-top: 12px;
            margin-bottom: 4px;
            color: #a35100;
        }
        .modal-content label i { width: 24px; font-size: 1.1rem; }
        .modal-content input, .modal-content select { width: 100%; margin-bottom: 8px; }
        .price-grid, .film-selection {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin: 16px 0;
        }
        .price-item, .film-item {
            background: #fff5e6;
            border-radius: 24px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .price-item .price-label, .film-item .film-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: #a35100;
            font-size: 0.85rem;
        }
        .price-item .price-label i, .film-item .film-label i { font-size: 1rem; width: 20px; }
        .price-item input, .film-item input, .film-item select { margin: 0; padding: 8px 12px; width: 100%; }
        .total-box {
            background: #ffebcc;
            border-radius: 32px;
            padding: 16px;
            text-align: center;
            margin-top: 16px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .flex-btns { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
        @media (max-width: 560px) { .price-grid, .film-selection { grid-template-columns: 1fr; } .modal-content { padding: 20px; } }
        .toast-msg {
            position: fixed; bottom: 20px; right: 20px; background: #4caf50; color: white;
            padding: 12px 24px; border-radius: 40px; font-weight: bold; z-index: 1100;
            animation: fadeInOut 2s ease;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(30px);}
            15% { opacity: 1; transform: translateY(0);}
            85% { opacity: 1; }
            100% { opacity: 0; visibility: hidden;}
        }
        .small-btn { padding: 4px 12px; font-size: 0.75rem; margin: 2px; min-height: 44px; }
        @media (max-width: 780px) {
            .app-container { grid-template-columns: 1fr; padding-bottom: 80px; }
            .sidebar {
                position: fixed; bottom: 0; left: 0; right: 0; top: auto; display: flex;
                flex-direction: row; justify-content: space-around; border-radius: 32px 32px 0 0;
                padding: 8px 12px; border-right: none; border-top: 5px solid #ffc28c; z-index: 200;
                background: #ffecb3;
            }
            .logo-area { display: none; }
            .menu-section-title { display: none; }
            .menu-item { flex-direction: column; gap: 4px; padding: 8px 12px; margin: 4px 0; font-size: 0.75rem; text-align: center; }
            .menu-item i { font-size: 1.5rem; width: auto; }
            .main-content { padding: 20px 16px 90px 16px; }
            .dashboard-stats { flex-direction: column; }
        }
        footer { text-align: center; margin-top: 40px; padding: 16px; font-size: 0.8rem; color: #b97f10; clear: both; }
        .delete-icon { cursor: pointer; color: #dc6b4a; }
        .badge-total { font-weight: bold; color: #e67e22; }
        .social-link { color: #3b5998; text-decoration: none; }
        .user-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff0d6;
            border-radius: 60px;
            padding: 8px 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
        }
        .user-info span { font-weight: bold; color: #a35100; }
        .logout-btn { background-color: #ffaeae; box-shadow: 0 3px 0 #b34141; padding: 4px 16px; font-size: 0.8rem; }
        .auth-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-card { max-width: 400px; width: 100%; padding: 32px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 16px; }
        .calendar-day {
            background: #fff5e6; border-radius: 20px; padding: 12px 6px; text-align: center;
            font-size: 0.85rem; border: 1px solid #ffcd94;
        }
        .calendar-day.rented { background: #ffaeae; color: white; text-decoration: line-through; }
        .calendar-day.today { border: 3px solid #ffb347; font-weight: bold; }
        .calendar-header { text-align: center; font-weight: bold; background: #ffe6b3; border-radius: 20px; padding: 8px; }
        .month-nav { display: flex; justify-content: space-between; align-items: center; margin: 16px 0; }
        .film-selector { margin-top: 16px; border-top: 2px dashed #ffcd94; padding-top: 16px; }
        .add-film-btn { margin-top: 8px; background-color: #a3e0b0; box-shadow: 0 3px 0 #488a2e; padding: 6px 12px; font-size: 0.8rem; }
        .search-box { margin-bottom: 16px; display: flex; gap: 8px; align-items: center; }
        .search-box input { flex: 1; }
    </style>
</head>
<body>
<div id="appRoot"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCUuq5cyAy_g7E0Lk2OPSPGxrd9P7umD9s",
        authDomain: "quan-ly-banhsungbo.firebaseapp.com",
        databaseURL: "https://quan-ly-banhsungbo-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "quan-ly-banhsungbo",
        storageBucket: "quan-ly-banhsungbo.firebasestorage.app",
        messagingSenderId: "311154959499",
        appId: "1:311154959499:web:6cc6d5ee44de864e43208e",
        measurementId: "G-4ZMVLL09C4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUserId = null;
    let currentUsername = null;
    let isAdmin = false;
    let cameras = [];
    let rentals = [];
    let films = [];
    let filmSales = [];
    let standaloneFilmSales = [];
    
    let appSettings = { 
        siteTitle: "Banhsungboo Pro", 
        headerText: "📸 Cho thuê máy ảnh & Bán film", 
        footerText: "© 2026 Banhsungboo - Thỏa sức sáng tạo",
        fontFamily: "'Comic Neue', 'Be Vietnam Pro', cursive"
    };
    let currentView = 'dashboard';
    let revenueChart = null;
    let selectedCameraForCalendar = null;
    let currentCalendarDate = new Date();
    let rentalSearchKeyword = '';

    function generateId() { return Date.now() + '-' + Math.random().toString(36).substr(2, 8); }
    function formatVND(amount) { return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount); }
    function formatDate(iso) { const d = new Date(iso); return `${d.getDate()}/${d.getMonth()+1} ${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`; }
    function formatHours(h) { return h.toFixed(1) + " giờ"; }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
    function getCameraName(cameraId) { const cam = cameras.find(c => c.id === cameraId); return cam ? cam.name : null; }
    function showToast(msg) {
        let existing = document.querySelector('.toast-msg');
        if (existing) existing.remove();
        let div = document.createElement('div');
        div.className = 'toast-msg';
        div.innerHTML = `<i class="fas fa-smile-wink"></i> ${msg}`;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 2000);
    }
    function hashPassword(pw) { return btoa(pw + "banhsungboo_salt"); }

    function isOverlap(cameraId, startISO, endISO, excludeId = null) {
        const newStart = new Date(startISO).getTime();
        const newEnd = new Date(endISO).getTime();
        return rentals.some(r => {
            if (r.cameraId !== cameraId) return false;
            if (excludeId && r.id === excludeId) return false;
            const rStart = new Date(r.startTime).getTime();
            const rEnd = new Date(r.endTime).getTime();
            return (newStart < rEnd && newEnd > rStart);
        });
    }

    // Thống kê
    function getStats() {
        let totalRevenue = 0, totalHours = 0;
        rentals.forEach(r => { totalRevenue += r.totalRevenue; totalHours += r.totalHours; });
        return { totalRevenue, totalHours, totalCameras: cameras.length, totalRentals: rentals.length };
    }
    function getMostRentedCamera() {
        const countMap = new Map();
        rentals.forEach(r => {
            if (!countMap.has(r.cameraId)) {
                let name = r.cameraName;
                if (!name) { const cam = cameras.find(c => c.id === r.cameraId); name = cam ? cam.name : "📷 Máy ảnh"; }
                countMap.set(r.cameraId, { count: 0, name });
            }
            countMap.get(r.cameraId).count += 1;
        });
        let bestId = null, bestCount = 0, bestName = "";
        for (let [id, data] of countMap) if (data.count > bestCount) { bestCount = data.count; bestId = id; bestName = data.name; }
        if (bestId) return { name: bestName, count: bestCount };
        return { name: "Chưa có lượt thuê", count: 0 };
    }
    function getTopCustomers(limit = 5) {
        const customerMap = new Map();
        rentals.forEach(r => {
            if (!r.customerName) return;
            const name = r.customerName;
            if (!customerMap.has(name)) customerMap.set(name, { count: 0, totalSpent: 0, social: r.customerSocial || '' });
            const entry = customerMap.get(name);
            entry.count += 1;
            entry.totalSpent += r.totalRevenue;
            if (r.customerSocial) entry.social = r.customerSocial;
        });
        const sorted = Array.from(customerMap.entries()).map(([name, data]) => ({ name, ...data }));
        sorted.sort((a, b) => b.count - a.count);
        return sorted.slice(0, limit);
    }

    // Thống kê film
    function getFilmStats() {
        let totalFilmRevenue = 0, totalFilmQuantity = 0;
        const filmCountMap = new Map();
        filmSales.forEach(sale => {
            const film = films.find(f => f.id === sale.filmId);
            const filmName = film ? film.name : "Film đã xóa";
            totalFilmRevenue += sale.revenue;
            totalFilmQuantity += sale.quantity;
            if (!filmCountMap.has(sale.filmId)) {
                filmCountMap.set(sale.filmId, { name: filmName, quantity: 0, revenue: 0 });
            }
            const entry = filmCountMap.get(sale.filmId);
            entry.quantity += sale.quantity;
            entry.revenue += sale.revenue;
        });
        let bestFilm = null, bestQuantity = 0;
        for (let [_, data] of filmCountMap) {
            if (data.quantity > bestQuantity) {
                bestQuantity = data.quantity;
                bestFilm = data;
            }
        }
        return { totalFilmRevenue, totalFilmQuantity, bestFilm: bestFilm ? bestFilm.name : "Chưa có", bestQuantity };
    }

    // CRUD
    async function addCamera(name) {
        if (!name.trim() || !currentUserId) return false;
        const newId = generateId();
        await set(ref(db, `users/${currentUserId}/cameras/${newId}`), { name: name.trim() });
        return true;
    }
    async function deleteCamera(cameraId) {
        if (!currentUserId) return false;
        const hasRentals = rentals.some(r => r.cameraId === cameraId);
        if (hasRentals && !confirm("⚠️ Máy đã có lịch sử thuê. Xóa máy sẽ KHÔNG xóa lịch sử. Tiếp tục?")) return false;
        await remove(ref(db, `users/${currentUserId}/cameras/${cameraId}`));
        return true;
    }
    async function updateCamera(cameraId, newName) {
        if (!currentUserId) return false;
        await update(ref(db, `users/${currentUserId}/cameras/${cameraId}`), { name: newName.trim() });
        return true;
    }
    
    async function addRental(cameraId, startISO, endISO, basePrice, extraPin, extraDamage, extraShipping, extraFilm, customerName, customerSocial, filmItems) {
        if (!currentUserId) return { success: false, msg: "Chưa đăng nhập" };
        const camera = cameras.find(c => c.id === cameraId);
        if (!camera) return { success: false, msg: "Máy ảnh không tồn tại" };
        if (!customerName.trim()) return { success: false, msg: "Vui lòng nhập tên khách hàng" };
        const start = new Date(startISO);
        const end = new Date(endISO);
        if (isNaN(start) || isNaN(end)) return { success: false, msg: "Ngày không hợp lệ" };
        if (end <= start) return { success: false, msg: "Kết thúc phải sau bắt đầu" };
        if (isOverlap(cameraId, startISO, endISO)) return { success: false, msg: "❌ Thời gian bị trùng với lịch thuê khác!" };
        const hours = (end - start) / 3600000;
        let rentalTotal = basePrice + extraPin + extraDamage + extraShipping + extraFilm;
        let filmTotal = 0;
        for (let item of filmItems) {
            const film = films.find(f => f.id === item.filmId);
            if (film) filmTotal += film.price * item.quantity;
        }
        const totalRevenue = rentalTotal + filmTotal;
        const newRentalId = generateId();
        const rentalData = {
            cameraId, cameraName: camera.name,
            startTime: start.toISOString(), endTime: end.toISOString(),
            totalHours: hours, basePrice, extraPin, extraDamage, extraShipping, extraFilm,
            totalRevenue, customerName: customerName.trim(), customerSocial: customerSocial.trim() || ""
        };
        await set(ref(db, `users/${currentUserId}/rentals/${newRentalId}`), rentalData);
        for (let item of filmItems) {
            if (item.quantity > 0) {
                const film = films.find(f => f.id === item.filmId);
                if (film) {
                    const saleId = generateId();
                    const saleData = {
                        rentalId: newRentalId,
                        filmId: item.filmId,
                        quantity: item.quantity,
                        revenue: film.price * item.quantity,
                        customerName: customerName.trim(),
                        customerSocial: customerSocial.trim() || "",
                        saleDate: new Date().toISOString()
                    };
                    await set(ref(db, `users/${currentUserId}/filmSales/${saleId}`), saleData);
                }
            }
        }
        return { success: true };
    }
    
    async function addStandaloneFilmSale(customerName, customerSocial, filmItems) {
        if (!currentUserId) return { success: false, msg: "Chưa đăng nhập" };
        if (!customerName.trim()) return { success: false, msg: "Vui lòng nhập tên khách hàng" };
        let filmTotal = 0;
        for (let item of filmItems) {
            const film = films.find(f => f.id === item.filmId);
            if (film) filmTotal += film.price * item.quantity;
        }
        if (filmTotal === 0) return { success: false, msg: "Vui lòng chọn ít nhất một loại film" };
        for (let item of filmItems) {
            if (item.quantity > 0) {
                const film = films.find(f => f.id === item.filmId);
                if (film) {
                    const saleId = generateId();
                    const saleData = {
                        rentalId: null,
                        filmId: item.filmId,
                        quantity: item.quantity,
                        revenue: film.price * item.quantity,
                        customerName: customerName.trim(),
                        customerSocial: customerSocial.trim() || "",
                        saleDate: new Date().toISOString()
                    };
                    await set(ref(db, `users/${currentUserId}/filmSales/${saleId}`), saleData);
                }
            }
        }
        return { success: true };
    }
    
    async function deleteRental(rentalId) {
        if (!currentUserId) return false;
        const salesToDelete = filmSales.filter(s => s.rentalId === rentalId);
        for (let sale of salesToDelete) await remove(ref(db, `users/${currentUserId}/filmSales/${sale.id}`));
        await remove(ref(db, `users/${currentUserId}/rentals/${rentalId}`));
        return true;
    }
    
    async function deleteFilmSale(saleId) {
        if (!currentUserId) return false;
        await remove(ref(db, `users/${currentUserId}/filmSales/${saleId}`));
        return true;
    }
    
    async function addFilm(name, price) {
        if (!name.trim() || price <= 0 || !currentUserId) return false;
        const newId = generateId();
        await set(ref(db, `users/${currentUserId}/films/${newId}`), { name: name.trim(), price: price });
        return true;
    }
    async function deleteFilm(filmId) {
        if (!currentUserId) return false;
        const hasSales = filmSales.some(s => s.filmId === filmId);
        if (hasSales && !confirm("⚠️ Film đã có trong lịch sử bán. Xóa sẽ giữ lịch sử. Tiếp tục?")) return false;
        await remove(ref(db, `users/${currentUserId}/films/${filmId}`));
        return true;
    }
    async function updateFilm(filmId, newName, newPrice) {
        if (!currentUserId) return false;
        await update(ref(db, `users/${currentUserId}/films/${filmId}`), { name: newName.trim(), price: newPrice });
        return true;
    }

    async function updateGlobalSettings(newSettings) {
        if (!isAdmin) return;
        await update(ref(db, `global_settings`), newSettings);
        if (newSettings.fontFamily) document.body.style.fontFamily = newSettings.fontFamily;
    }

    function subscribeGlobalSettings() {
        onValue(ref(db, `global_settings`), (snap) => {
            const data = snap.val();
            if (data) {
                appSettings = { ...appSettings, ...data };
                if (appSettings.fontFamily) document.body.style.fontFamily = appSettings.fontFamily;
            } else set(ref(db, `global_settings`), appSettings);
            document.title = appSettings.siteTitle;
            const titleEl = document.getElementById('dynamicTitle');
            if (titleEl) titleEl.innerHTML = `<i class="fas fa-camera-retro"></i> ${appSettings.siteTitle}`;
            reRenderCurrentView();
        });
    }

    function updateFilmSelects() {
        const options = films.map(f => `<option value="${f.id}">${escapeHtml(f.name)} - ${formatVND(f.price)}</option>`).join('');
        const filmSelect = document.getElementById('filmSelect');
        if (filmSelect) filmSelect.innerHTML = options || '<option>Chưa có film</option>';
        const standaloneSelect = document.getElementById('standaloneFilmSelect');
        if (standaloneSelect) standaloneSelect.innerHTML = options || '<option>Chưa có film</option>';
    }

    function subscribeUserData() {
        if (!currentUserId) return;
        onValue(ref(db, `users/${currentUserId}/cameras`), (snap) => {
            cameras = snap.val() ? Object.entries(snap.val()).map(([k,v]) => ({ id: k, name: v.name })) : [];
            reRenderCurrentView();
        });
        onValue(ref(db, `users/${currentUserId}/rentals`), (snap) => {
            rentals = snap.val() ? Object.entries(snap.val()).map(([k,v]) => ({ id: k, ...v })) : [];
            reRenderCurrentView();
        });
        onValue(ref(db, `users/${currentUserId}/films`), (snap) => {
            films = snap.val() ? Object.entries(snap.val()).map(([k,v]) => ({ id: k, name: v.name, price: v.price })) : [];
            updateFilmSelects();
            reRenderCurrentView();
        });
        onValue(ref(db, `users/${currentUserId}/filmSales`), (snap) => {
            filmSales = snap.val() ? Object.entries(snap.val()).map(([k,v]) => ({ id: k, ...v })) : [];
            standaloneFilmSales = filmSales.filter(s => !s.rentalId);
            reRenderCurrentView();
        });
    }

    function reRenderCurrentView() {
        if (!currentUserId) return;
        if (currentView === 'dashboard') renderDashboard();
        else if (currentView === 'cameras') renderCameras();
        else if (currentView === 'rentals') renderAllRentals();
        else if (currentView === 'films') renderFilms();
        else if (currentView === 'filmSales') renderFilmSales();
        else if (currentView === 'calendar') renderCalendar();
        else if (currentView === 'settings' && isAdmin) renderSettings();
        else if (currentView === 'admin' && isAdmin) renderAdminDashboard();
        else if (isAdmin) renderAdminDashboard();
        else renderDashboard();
        document.querySelectorAll('.menu-item').forEach(item => {
            if (item.dataset.view === currentView) item.classList.add('active');
            else item.classList.remove('active');
        });
    }

    // Calendar
    function renderCalendar() {
        if (!cameras.length) {
            document.getElementById('mainContent').innerHTML = `<div class="cartoon-card" style="padding:20px; text-align:center">🎈 Chưa có máy ảnh nào. Hãy thêm máy trước.</div>`;
            return;
        }
        if (!selectedCameraForCalendar || !cameras.find(c => c.id === selectedCameraForCalendar)) selectedCameraForCalendar = cameras[0]?.id;
        const year = currentCalendarDate.getFullYear();
        const month = currentCalendarDate.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const startDayOfWeek = firstDay.getDay();
        const daysInMonth = lastDay.getDate();
        const rentedDays = new Set();
        rentals.filter(r => r.cameraId === selectedCameraForCalendar).forEach(r => {
            const start = new Date(r.startTime);
            const end = new Date(r.endTime);
            for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                if (d.getFullYear() === year && d.getMonth() === month) rentedDays.add(d.getDate());
            }
        });
        let calendarHtml = `<div class="user-info"><span><i class="fas fa-user-circle"></i> ${escapeHtml(currentUsername)}${isAdmin ? ' (Admin)' : ''}</span><button id="logoutBtn" class="logout-btn">Đăng xuất</button></div>`;
        calendarHtml += `<div class="cartoon-card" style="padding:20px;"><h2><i class="fas fa-calendar-alt"></i> Lịch hoạt động máy ảnh</h2>`;
        calendarHtml += `<div style="margin:16px 0;"><label>Chọn máy: </label><select id="cameraSelectCalendar">${cameras.map(c => `<option value="${c.id}" ${selectedCameraForCalendar === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}</select></div>`;
        calendarHtml += `<div class="month-nav"><button id="prevMonthBtn" class="cute-btn small-btn"><i class="fas fa-chevron-left"></i> Tháng trước</button><span style="font-size:1.2rem; font-weight:bold;">Tháng ${month+1}/${year}</span><button id="nextMonthBtn" class="cute-btn small-btn">Tháng sau <i class="fas fa-chevron-right"></i></button></div>`;
        calendarHtml += `<div class="calendar-grid">`;
        const weekdays = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
        weekdays.forEach(day => calendarHtml += `<div class="calendar-header">${day}</div>`);
        for (let i = 0; i < startDayOfWeek; i++) calendarHtml += `<div class="calendar-day"></div>`;
        const today = new Date();
        for (let d = 1; d <= daysInMonth; d++) {
            const isRented = rentedDays.has(d);
            const isToday = (today.getFullYear() === year && today.getMonth() === month && today.getDate() === d);
            calendarHtml += `<div class="calendar-day ${isRented ? 'rented' : ''} ${isToday ? 'today' : ''}">${d}${isRented ? '<br><i class="fas fa-ban"></i>' : ''}</div>`;
        }
        calendarHtml += `</div></div><footer>${escapeHtml(appSettings.footerText)}</footer>`;
        document.getElementById('mainContent').innerHTML = calendarHtml;
        document.getElementById('logoutBtn')?.addEventListener('click', () => logout());
        document.getElementById('cameraSelectCalendar')?.addEventListener('change', (e) => { selectedCameraForCalendar = e.target.value; renderCalendar(); });
        document.getElementById('prevMonthBtn')?.addEventListener('click', () => { currentCalendarDate.setMonth(currentCalendarDate.getMonth() - 1); renderCalendar(); });
        document.getElementById('nextMonthBtn')?.addEventListener('click', () => { currentCalendarDate.setMonth(currentCalendarDate.getMonth() + 1); renderCalendar(); });
    }

    // Cameras
    function renderCameras() {

    // Lịch thuê có tìm kiếm
    function renderAllRentals() {
        let filtered = [...rentals];
        if (rentalSearchKeyword.trim()) {
            const kw = rentalSearchKeyword.trim().toLowerCase();
            filtered = rentals.filter(r => 
                (r.customerName && r.customerName.toLowerCase().includes(kw)) ||
                (r.cameraName && r.cameraName.toLowerCase().includes(kw)) ||
                (getCameraName(r.cameraId) && getCameraName(r.cameraId).toLowerCase().includes(kw))
            );
        }
        let html = `<div class="user-info"><span><i class="fas fa-user-circle"></i> ${escapeHtml(currentUsername)}${isAdmin ? ' (Admin)' : ''}</span><button id="logoutBtn" class="logout-btn">Đăng xuất</button></div>
            <div class="cartoon-card" style="padding:20px;"><h2>📋 Toàn bộ lịch sử cho thuê máy & film kèm</h2></div>
            <div class="search-box"><input type="text" id="rentalSearchInput" placeholder="🔍 Tìm theo tên khách hàng hoặc máy ảnh..." value="${escapeHtml(rentalSearchKeyword)}"><button id="searchRentalBtn" class="cute-btn small-btn">Tìm</button><button id="resetSearchBtn" class="cute-btn small-btn btn-danger">Xóa</button></div>

        if (filtered.length===0) html+=`<tr><td colspan="8" class="text-center">🎈 Không tìm thấy lịch thuê nào phù hợp</td></tr>`;
        filtered.sort((a,b)=>new Date(b.startTime)-new Date(a.startTime)).forEach(r=>{
            const filmSaleItems = filmSales.filter(s => s.rentalId === r.id);
            let filmDetails = '';
            if (filmSaleItems.length) {
                filmDetails = filmSaleItems.map(s => {
                    const f = films.find(fi => fi.id === s.filmId);
                    return `${f ? f.name : 'Film?'} x${s.quantity}`;

            } else filmDetails = '—';
            html+=`<tr>
                <td><strong>${escapeHtml(r.customerName||'—')}</strong></td>

                <td>${filmDetails}</td>
                <td><strong>${formatVND(r.totalRevenue)}</strong></td>
                <td><button class="small-btn btn-danger deleteRentalGlobal" data-id="${r.id}"><i class="fas fa-trash"></i></button></td>
            </tr>`;
        });
        html+=`</tbody></table></div><footer>${escapeHtml(appSettings.footerText)}</footer>`;
        document.getElementById('mainContent').innerHTML = html;
        document.getElementById('logoutBtn')?.addEventListener('click',()=>logout());
        document.getElementById('searchRentalBtn')?.addEventListener('click',()=>{
            rentalSearchKeyword = document.getElementById('rentalSearchInput').value;
            renderAllRentals();
        });
        document.getElementById('resetSearchBtn')?.addEventListener('click',()=>{
            rentalSearchKeyword = '';
            renderAllRentals();

    // Helper cho film selection (thuê máy)
    let selectedFilmItems = [];
    function renderFilmSelection() {
        const container = document.getElementById('filmItemsContainer');
        if (!container) return;
        container.innerHTML = '';
        selectedFilmItems.forEach((item, idx) => {
            const film = films.find(f => f.id === item.filmId);
            if (!film) return;
            const div = document.createElement('div');
            div.className = 'film-item';
            div.innerHTML = `
                <div class="film-label"><i class="fas fa-film"></i> ${escapeHtml(film.name)} - ${formatVND(film.price)}/cuộn</div>
                <div style="display:flex; gap:8px;">
                    <input type="number" class="film-qty" data-idx="${idx}" value="${item.quantity}" min="1" step="1" style="flex:1">
                    <button class="small-btn btn-danger remove-film-btn" data-idx="${idx}"><i class="fas fa-trash"></i></button>
                </div>
            `;
            container.appendChild(div);
        });
        document.querySelectorAll('.film-qty').forEach(input => {
            input.addEventListener('change', (e) => {
                const idx = parseInt(e.target.dataset.idx);
                let newQty = parseInt(e.target.value) || 0;
                if (newQty <= 0) selectedFilmItems.splice(idx, 1);
                else selectedFilmItems[idx].quantity = newQty;
                renderFilmSelection();
                updatePreviewTotal();
            });
        });
        document.querySelectorAll('.remove-film-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const idx = parseInt(btn.dataset.idx);
                selectedFilmItems.splice(idx, 1);
                renderFilmSelection();
                updatePreviewTotal();
            });
        });
    }
    
    function updatePreviewTotal() {
        const base = parseFloat(document.getElementById('basePrice').value) || 0;
        const pin = parseFloat(document.getElementById('extraPin').value) || 0;
        const damage = parseFloat(document.getElementById('extraDamage').value) || 0;
        const ship = parseFloat(document.getElementById('extraShipping').value) || 0;
        const extraFilm = parseFloat(document.getElementById('extraFilm').value) || 0;
        let rentalTotal = base + pin + damage + ship + extraFilm;
        let filmTotal = 0;
        for (let item of selectedFilmItems) {
            const film = films.find(f => f.id === item.filmId);
            if (film) filmTotal += film.price * item.quantity;
        }
        const total = rentalTotal + filmTotal;
        document.getElementById('previewTotal').innerHTML = formatVND(total);
    }

    // Khởi tạo modal
    function initModals() {
        const rentalModal = document.getElementById('rentalModal');
        document.getElementById('closeModalBtn').onclick = () => rentalModal.style.visibility = 'hidden';
        window.onclick = (e) => { if (e.target === rentalModal) rentalModal.style.visibility = 'hidden'; };
        const priceInputs = ['basePrice', 'extraPin', 'extraDamage', 'extraShipping', 'extraFilm'];
        priceInputs.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('input', updatePreviewTotal);
        });
        const addFilmSelectBtn = document.getElementById('addFilmSelectBtn');
        if (addFilmSelectBtn) {
            addFilmSelectBtn.onclick = () => {
                const filmId = document.getElementById('filmSelect').value;
                if (filmId) {
                    const existing = selectedFilmItems.find(item => item.filmId === filmId);
                    if (existing) existing.quantity += 1;
                    else selectedFilmItems.push({ filmId, quantity: 1 });
                    renderFilmSelection();
                    updatePreviewTotal();
                }
            };
        }
        document.getElementById('saveRentalBtn').onclick = async () => {
            const camId = document.getElementById('modalCameraId').value;
            const customerName = document.getElementById('customerName').value;
            const customerSocial = document.getElementById('customerSocial').value;
            const start = document.getElementById('rentalStart').value;
            const end = document.getElementById('rentalEnd').value;
            const base = parseFloat(document.getElementById('basePrice').value) || 0;
            const pin = parseFloat(document.getElementById('extraPin').value) || 0;
            const damage = parseFloat(document.getElementById('extraDamage').value) || 0;
            const ship = parseFloat(document.getElementById('extraShipping').value) || 0;
            const extraFilm = parseFloat(document.getElementById('extraFilm').value) || 0;
            if (!start || !end) { showToast("Vui lòng chọn thời gian!"); return; }
            if (!customerName.trim()) { showToast("Vui lòng nhập tên khách hàng!"); return; }
            const filmItems = selectedFilmItems.map(item => ({ filmId: item.filmId, quantity: item.quantity }));
            const result = await addRental(camId, start, end, base, pin, damage, ship, extraFilm, customerName, customerSocial, filmItems);
            if (result.success) { showToast("✅ Đặt lịch thành công!"); rentalModal.style.visibility = 'hidden'; selectedFilmItems = []; }
            else showToast(`❌ ${result.msg}`);
        };
        
        const standaloneModal = document.getElementById('standaloneFilmSaleModal');
        document.getElementById('closeStandaloneModalBtn').onclick = () => standaloneModal.style.visibility = 'hidden';
        window.onclick = (e) => { if (e.target === standaloneModal) standaloneModal.style.visibility = 'hidden'; };
        const addStandaloneFilmBtn = document.getElementById('addStandaloneFilmBtn');
        if (addStandaloneFilmBtn) {
            addStandaloneFilmBtn.onclick = () => {
                const filmId = document.getElementById('standaloneFilmSelect').value;
                if (filmId) {
                    const existing = standaloneSelectedItems.find(item => item.filmId === filmId);
                    if (existing) existing.quantity += 1;
                    else standaloneSelectedItems.push({ filmId, quantity: 1 });
                    renderStandaloneFilmSelection();
                    updateStandaloneTotal();
                }
            };
        }
        document.getElementById('saveStandaloneSaleBtn').onclick = async () => {
            const customerName = document.getElementById('standaloneCustomerName').value;
            const customerSocial = document.getElementById('standaloneCustomerSocial').value;
            if (!customerName.trim()) { showToast("Vui lòng nhập tên khách hàng!"); return; }
            if (standaloneSelectedItems.length === 0) { showToast("Vui lòng chọn ít nhất một loại film!"); return; }
            const filmItems = standaloneSelectedItems.map(item => ({ filmId: item.filmId, quantity: item.quantity }));
            const result = await addStandaloneFilmSale(customerName, customerSocial, filmItems);
            if (result.success) {
                showToast("✅ Bán film thành công!");
                standaloneModal.style.visibility = 'hidden';
                standaloneSelectedItems = [];
                renderFilmSales();
            } else showToast(`❌ ${result.msg}`);
        };
        
        const editModal = document.getElementById('editCameraModal');
        document.getElementById('closeEditModalBtn').onclick = () => editModal.style.visibility = 'hidden';
        window.onclick = (e) => { if (e.target === editModal) editModal.style.visibility = 'hidden'; };
        document.getElementById('saveEditCameraBtn').onclick = async () => {
            const id = document.getElementById('editCameraId').value;
            const newName = document.getElementById('editCameraName').value;
            if (newName.trim()) { await updateCamera(id, newName); showToast("✏️ Đã cập nhật tên máy"); editModal.style.visibility = 'hidden'; }
            else showToast("Tên máy không được để trống");
        };
    }

    // AUTH
    async function register(username, password, confirmPassword) {
        if(password!==confirmPassword) throw new Error("Mật khẩu nhập lại không khớp");
        if(username.length<3) throw new Error("Tên đăng nhập phải >=3 ký tự");
        const userRef=ref(db,`users_meta/${username}`);
        const snap=await get(userRef);
        if(snap.exists()) throw new Error("Tên đăng nhập đã tồn tại");
        const userId=generateId();
        const hashed=hashPassword(password);
        const isAdminFlag=(username==='admin');
        await set(ref(db,`users_meta/${username}`),{ userId, password:hashed, isAdmin:isAdminFlag });
        await set(ref(db,`user_profiles/${userId}`),{ username });
        return userId;
    }

    async function login(username, password) {
        const userRef=ref(db,`users_meta/${username}`);
        const snap=await get(userRef);
        if(!snap.exists()) throw new Error("Tên đăng nhập không tồn tại");
        const data=snap.val();
        if(data.password!==hashPassword(password)) throw new Error("Sai mật khẩu");
        return { userId:data.userId, isAdmin:data.isAdmin===true };
    }

        localStorage.removeItem("banhsungboo_userId");

                        <button id="closeEditModalBtn" class="cute-btn"><i class="fas fa-times"></i> Hủy</button>
                    </div>
                </div>
            </div>
        `;
        
        document.getElementById('appRoot').innerHTML = `<div class="app-container">${sidebarHtml}</div>${modalHtml}`;
        
        initModals();
        subscribeGlobalSettings();
        subscribeUserData();
        const attachMenu = () => {
            document.querySelectorAll('.menu-item').forEach(item => {
                item.removeEventListener('click', () => {});
                item.addEventListener('click', () => setActiveView(item.dataset.view));
            });
            document.querySelectorAll('.menu-item').forEach(item => {
                if (item.dataset.view === currentView) item.classList.add('active');
                else item.classList.remove('active');
            });
        };
        setTimeout(attachMenu, 100);
        setActiveView(isAdmin ? 'admin' : 'dashboard');
    }

    function setActiveView(view){ currentView = view; reRenderCurrentView(); }

    async function renderAuthForm() {
        await ensureAdminAccount();
        const html=`<div class="auth-container"><div class="cartoon-card auth-card"><h2 style="text-align:center"><i class="fas fa-camera-retro"></i> Banhsungboo</h2>
            <div id="authTabs" style="display:flex; gap:10px; margin:20px 0;"><button id="tabLogin" class="cute-btn" style="flex:1">Đăng nhập</button><button id="tabRegister" class="cute-btn" style="flex:1">Đăng ký</button></div>
            <div id="authForm"><input type="text" id="username" placeholder="Tên đăng nhập" style="width:100%; margin:10px 0"><input type="password" id="password" placeholder="Mật khẩu" style="width:100%; margin:10px 0">
            <div id="confirmPasswordField" style="display:none;"><input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" style="width:100%; margin:10px 0"></div>
            <button id="submitAuthBtn" class="cute-btn btn-success" style="width:100%">Đăng nhập</button></div><div id="authMessage" class="text-center" style="margin-top:16px; color:#e67e22;"></div></div></div>`;
        document.getElementById('appRoot').innerHTML = html;
        let isLogin=true;
        const updateForm=()=>{
            const cf=document.getElementById('confirmPasswordField');
            const btn=document.getElementById('submitAuthBtn');
            if(isLogin){ if(cf) cf.style.display='none'; if(btn) btn.innerText="Đăng nhập"; }
            else{ if(cf) cf.style.display='block'; if(btn) btn.innerText="Đăng ký"; }
            document.getElementById('authMessage').innerText="";
        };
        document.getElementById('tabLogin').onclick=()=>{ isLogin=true; updateForm(); };
        document.getElementById('tabRegister').onclick=()=>{ isLogin=false; updateForm(); };
        document.getElementById('submitAuthBtn').onclick=async()=>{
            const username=document.getElementById('username').value.trim();
            const password=document.getElementById('password').value;
            if(!username||!password){ showToast("Vui lòng nhập đầy đủ"); return; }
            try{
                if(isLogin){
                    const {userId, isAdmin:adminFlag}=await login(username,password);
                    currentUserId=userId; currentUsername=username; isAdmin=adminFlag;
                    localStorage.setItem("banhsungboo_userId",userId);
                    localStorage.setItem("banhsungboo_username",username);
                    localStorage.setItem("banhsungboo_isAdmin",adminFlag);
                    startApp();
                } else {
                    const confirm=document.getElementById('confirmPassword').value;
                    await register(username,password,confirm);
                    showToast("Đăng ký thành công! Vui lòng đăng nhập.");
                    isLogin=true; updateForm();
                }
            } catch(err){ showToast("Lỗi: "+err.message); }
        };
    }

    function checkSession(){
        const savedId=localStorage.getItem("banhsungboo_userId");
        const savedName=localStorage.getItem("banhsungboo_username");
        const savedAdmin=localStorage.getItem("banhsungboo_isAdmin")==='true';
        if(savedId && savedName){
            currentUserId=savedId; currentUsername=savedName; isAdmin=savedAdmin;
            startApp();
        } else renderAuthForm();
    }
    checkSession();
</script>
</body>
</html>
